apiVersion: apps/v1
kind: Deployment
metadata:
  name: camvote-backend
  labels:
    app: camvote-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: camvote-backend
  template:
    metadata:
      labels:
        app: camvote-backend
    spec:
      containers:
      - name: backend
        image: ln247/camvote-backend:latest
        imagePullPolicy: Always # Fixes the ErrImageNeverPull error!
        ports:
        - containerPort: 5000 # Replace with your Python or Node backend port
        env:
        - name: NODE_ENV
          value: "production"

---

apiVersion: v1
kind: Service
metadata:
  name: camvote-backend-service
spec:
  selector:
    app: camvote-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: camvote-frontend
  labels:
    app: camvote-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: camvote-frontend
  template:
    metadata:
      labels:
        app: camvote-frontend
    spec:
      containers:
      - name: frontend
        image: YOUR_DOCKERHUB_USERNAME/camvote-frontend:latest
        imagePullPolicy: Always # Fixes the ErrImageNeverPull error!
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_URL
          value: "http://camvote-backend-service:5000"

---

apiVersion: v1
kind: Service
metadata:
  name: camvote-frontend-service
spec:
  type: NodePort
  selector:
    app: camvote-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080 # Exposes the web interface externally on your server
      env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: camvote-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: camvote-secrets
              key: JWT_SECRET