---
- name: Hardening and Provisioning Core CamVote Server
  hosts: localhost
  gather_facts: yes
  become: yes

  tasks:
    - name: 1. Validate Core System Utilities Are Present
      apt:
        name:
          - curl
          - git
          - software-properties-common
        state: present
        update_cache: yes

    - name: 2. Enforce Active Docker Daemon State
      service:
        name: docker
        state: started
        enabled: yes

    - name: 3. Isolate Dedicated Log Directories for Applications
      file:
        path: /root/CamVote-Deploy/production_logs
        state: directory
        mode: '0755'
