version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: camvote-jenkins
    privileged: true
    user: root
    ports:
      - "8082:8080" # Maps Jenkins UI to port 8082 on your server
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Allows Jenkins to build Docker images
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: camvote-grafana
    ports:
      - "3000:3000" # Maps Grafana UI to port 3000 on your server
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  jenkins_data:
  grafana_data:
